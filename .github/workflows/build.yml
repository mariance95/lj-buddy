name: artnet-translator

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["artnet-translator/**", "LICENSE", ".github/workflows/build.yml"]
  pull_request:
    paths: ["artnet-translator/**", "LICENSE", ".github/workflows/build.yml"]

permissions:
  contents: write

# Compila el complemento ArtNet to DMX Translator (carpeta artnet-translator).
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artnet-translator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: artnet-translator/go.mod
          cache-dependency-path: artnet-translator/go.sum
      - name: Instalar NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Compilar
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lj-buddy
          path: |
            artnet-translator/dist/*.exe
            artnet-translator/dist/*.zip
            artnet-translator/dist/*.tar.gz
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artnet-translator/dist/*.exe
            artnet-translator/dist/*.zip
            artnet-translator/dist/*.tar.gz
