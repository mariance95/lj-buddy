<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LJ Buddy ArtNet Translator</title>
<style>
:root{
  --bg:#0a0a0a; --panel:#151515; --panel2:#1e1e1e; --line:#303030; --text:#f2f2f2; --dim:#8c8c8c;
  /* Paleta ShowBuddy: LJ ámbar, VJ verde azulado, DJ rojo pastel, CJ celeste, SJ púrpura */
  --amber:#ffb000; --teal:#1fd6ae; --red:#ff8080; --sky:#5ccbff; --purple:#b388ff;
  --accent:#f2f2f2; --ok:var(--teal); --warn:var(--amber); --bad:var(--red); --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
header h1 .lj{color:var(--amber)}
header .sub{color:var(--dim);font-size:13px;letter-spacing:.3px;padding-left:14px;border-left:1px solid var(--line)}
header .ver{color:var(--dim);font-size:12px}
header .grow{flex:1}
main{max-width:1080px;margin:0 auto;padding:20px 22px 60px;display:grid;gap:18px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);margin:0 0 12px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.pill.kind{color:var(--sky);border-color:var(--sky)}
.ok .dot{background:var(--ok);box-shadow:0 0 6px var(--ok)} .warn .dot{background:var(--warn)} .test .dot{background:var(--purple);box-shadow:0 0 6px var(--purple)} .bad .dot{background:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
label{display:grid;gap:5px;font-size:12px;color:var(--dim)}
input,select,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 10px}
input:focus,select:focus{outline:2px solid var(--sky);outline-offset:-1px}
input[type=number]{width:96px;font-family:var(--mono)}
button{cursor:pointer}
button:hover{border-color:var(--dim)}
button.primary{background:var(--amber);color:#0a0a0a;border-color:var(--amber);font-weight:600}
button.ghost{background:none}
button.on{background:var(--purple);color:#0a0a0a;border-color:var(--purple)}
.hint{color:var(--dim);font-size:12px;margin-top:10px}
.err{color:var(--bad);font-size:13px;margin-top:8px}
.devs{display:grid;gap:12px}
.dev{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:14px 16px;display:grid;gap:10px}
.dev.off{opacity:.6}
.dev .top{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dev .name{font-weight:600;font-size:15px}
.dev .meta{color:var(--dim);font-size:12px;font-family:var(--mono)}
.outs{display:flex;flex-wrap:wrap;gap:12px}
.out{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.out b{font-size:12px;color:var(--dim);font-weight:600}
.out .addr{font-family:var(--mono);font-size:11px;color:var(--dim)}
.out .fps{font-family:var(--mono);font-size:12px;min-width:52px;text-align:right}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions select,.actions button{padding:5px 9px;font-size:12px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--dim);font-weight:500;font-size:12px}
td.num{font-family:var(--mono)}
.empty{color:var(--dim);padding:8px 0}
canvas{width:100%;height:120px;background:#050505;border-radius:7px;border:1px solid var(--line);display:block}
pre{margin:0;max-height:180px;overflow:auto;font:12px/1.5 var(--mono);color:var(--dim);white-space:pre-wrap}
a.src{color:var(--sky);cursor:pointer;text-decoration:underline dotted}
#lost{display:none;position:fixed;inset:auto 0 0 0;background:var(--bad);color:#fff;text-align:center;padding:10px;font-weight:600}
</style>
</head>
<body>
<header>
  <h1><span class="lj">LJ</span> Buddy</h1><span class="sub">ArtNet to DMX Translator</span><span class="ver" id="ver"></span>
  <span class="grow"></span>
  <span class="pill" id="netpill"><span class="dot"></span><span id="nettext">Iniciando…</span></span>
  <button class="ghost" id="quit" title="Detener el puente y cerrar el programa">Salir</button>
</header>
<main>
  <section>
    <h2>Entrada Art-Net</h2>
    <div class="row">
      <label>Escuchar en (interfaz de red)
        <select id="listenIP"></select>
      </label>
      <label>IP de origen Art-Net
        <input id="sourceIP" placeholder="Cualquiera" size="16" spellcheck="false">
      </label>
      <label>Primer universo para autoasignar
        <input id="firstUniverse" type="number" min="0" max="32767">
      </label>
      <button class="primary" id="saveNet">Aplicar</button>
    </div>
    <div class="err" id="netErr"></div>
    <div class="hint" id="sources"></div>
  </section>

  <section>
    <h2>Interfaces DMX</h2>
    <div class="devs" id="devs"></div>
    <div class="err" id="devErr"></div>
    <div id="others"></div>
  </section>

  <section>
    <h2>Universos recibidos</h2>
    <div id="unis"></div>
  </section>

  <section>
    <h2>Monitor de canales</h2>
    <div class="row" style="margin-bottom:10px">
      <label>Universo <input id="monU" type="number" min="0" max="32767" value="0"></label>
      <span class="hint" id="monInfo"></span>
    </div>
    <canvas id="mon" width="1024" height="120"></canvas>
  </section>

  <section>
    <h2>Registro</h2>
    <pre id="log"></pre>
  </section>
</main>
<div id="lost">LJ Buddy ArtNet Translator no responde. El programa se cerró o se está reiniciando.</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const addr = u => `Net ${u >> 8} · Sub ${(u >> 4) & 15} · Uni ${u & 15}`;
let state = null, netDirty = false, quitting = false;

async function post(path, body, errEl) {
  const r = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json', 'X-LJ-Buddy': '1'}, body: JSON.stringify(body || {})});
  const j = await r.json().catch(() => ({}));
  if (errEl) errEl.textContent = r.ok ? '' : (j.error || 'Error');
  refresh();
  return r.ok;
}

function editing(root) {
  const a = document.activeElement;
  return a && root.contains(a) && (a.tagName === 'INPUT' || a.tagName === 'SELECT');
}

function renderNet(s) {
  const pill = $('netpill');
  if (s.listening) {
    const act = s.universes.some(u => u.active);
    pill.className = 'pill ' + (act ? 'ok' : 'warn');
    $('nettext').textContent = act ? 'Recibiendo Art-Net' : 'Escuchando, sin señal';
  } else {
    pill.className = 'pill bad';
    $('nettext').textContent = 'Sin escucha Art-Net';
  }
  $('ver').textContent = 'v' + s.version;
  if (!netDirty && !editing($('listenIP').closest('section'))) {
    const ips = ['0.0.0.0', ...s.localIPs.filter(i => i !== '0.0.0.0')];
    if (!ips.includes(s.listenIP)) ips.push(s.listenIP);
    $('listenIP').innerHTML = ips.map(i => `<option value="${esc(i)}">${i === '0.0.0.0' ? 'Todas las interfaces' : esc(i)}</option>`).join('');
    $('listenIP').value = s.listenIP;
    $('sourceIP').value = s.sourceIP;
    $('firstUniverse').value = s.firstUniverse;
  }
  if (s.listenError) $('netErr').textContent = 'No se puede escuchar en el puerto UDP 6454: ' + s.listenError;
  else if (!$('netErr').dataset.user) $('netErr').textContent = '';
  $('sources').innerHTML = s.sources.length
    ? 'Emisores detectados: ' + s.sources.map(x => `<a class="src" data-ip="${esc(x.ip)}" title="Usar solo este emisor">${esc(x.ip)}</a>${x.active ? '' : ' (inactivo)'}${x.ip === s.sourceIP ? ' ✓' : ''}`).join(', ') + (s.sourceIP ? '' : '. Haz clic en uno para aceptar solo sus datos.')
    : 'Todavía no se detectó ningún emisor Art-Net en la red.';
}

function renderDevs(s) {
  const root = $('devs');
  if (editing(root)) {
    // No se redibuja mientras se edita; solo se actualizan los indicadores.
    s.devices.forEach(d => d.outputs.forEach((o, i) => {
      const el = root.querySelector(`[data-fps="${CSS.escape(d.id)}/${i}"]`);
      if (el) el.textContent = d.running ? o.fps + ' Hz' : '';
    }));
    return;
  }
  if (!s.devices.length) {
    root.innerHTML = `<div class="empty">No se detectó ninguna interfaz DMX. Conecta una por USB: aparecerá aquí sola en un par de segundos.</div>`;
  } else root.innerHTML = s.devices.map(d => {
    let st, cls;
    if (!d.present) [st, cls] = ['Desconectada', ''];
    else if (!d.enabled) [st, cls] = ['Deshabilitada', ''];
    else if (d.running) [st, cls] = [d.test ? 'Prueba: todo al 100 %' : 'Transmitiendo', d.test ? 'test' : 'ok'];
    else if (d.error) [st, cls] = ['Error', 'bad'];
    else [st, cls] = ['Iniciando…', 'warn'];
    const outs = d.outputs.map((o, i) => `
      <div class="out">
        <b>${d.outputs.length > 1 ? 'Salida ' + (i + 1) : 'Salida DMX'}</b>
        <span>←</span>
        <label style="display:contents"><input type="number" min="0" max="32767" value="${o.universe}" data-uni="${esc(d.id)}" data-i="${i}" title="Universo Art-Net (0-32767)"></label>
        <span class="addr">${addr(o.universe)}</span>
        <span class="pill ${o.signal ? 'ok' : ''}" title="${o.signal ? 'Llega Art-Net para este universo' : 'No llega Art-Net para este universo'}"><span class="dot"></span>${o.signal ? 'Señal' : 'Sin señal'}</span>
        <span class="fps" data-fps="${esc(d.id)}/${i}">${d.running ? o.fps + ' Hz' : ''}</span>
      </div>`).join('');
    return `<div class="dev ${d.present && d.enabled ? '' : 'off'}">
      <div class="top">
        <span class="name">${esc(d.name)}</span>
        <span class="pill ${cls}"><span class="dot"></span>${st}</span>
        <span class="pill kind">${esc(d.kindLabel)}${d.outputs.length > 1 ? ' · ' + d.outputs.length + ' universos' : ''}</span>
        <span class="meta">${esc([d.port, d.detail || (d.serial ? 'N/S ' + d.serial : '')].filter(Boolean).join(' · '))}</span>
      </div>
      <div class="outs">${outs}</div>
      ${d.error ? `<div class="err">${esc(d.error)}</div>` : ''}
      <div class="actions">
        <button data-act="enable" data-id="${esc(d.id)}">${d.enabled ? 'Deshabilitar' : 'Habilitar'}</button>
        ${d.running ? `<button data-act="test" data-id="${esc(d.id)}" class="${d.test ? 'on' : ''}" title="Envía todos los canales al 100 % para comprobar la interfaz">Probar salida</button>` : ''}
        ${d.kind !== 'sim' ? `<select data-kind="${esc(d.id)}" title="Protocolo de la interfaz">
          <option value="" ${d.kindMode === '' ? 'selected' : ''}>Tipo: autodetectar</option>
          <option value="opendmx" ${d.kindMode === 'opendmx' ? 'selected' : ''}>Tipo: Open DMX</option>
          <option value="pro" ${d.kindMode === 'pro' ? 'selected' : ''}>Tipo: DMX USB Pro</option>
        </select>` : ''}
        <button data-act="forget" data-id="${esc(d.id)}" class="ghost" title="Borra la asignación guardada de esta interfaz">Olvidar</button>
      </div>
    </div>`;
  }).join('');

  $('others').innerHTML = s.otherPorts.length ? `<div class="hint">Otros puertos serie (no FTDI): ` +
    s.otherPorts.map(p => `${esc(p.name)} (${esc(p.desc)}) <button data-add="${esc(p.name)}" style="padding:2px 8px;font-size:12px">Usar como interfaz DMX</button>`).join(' · ') + `</div>` : '';
  if (s.scanError) $('devErr').textContent = 'No se pudieron enumerar los puertos: ' + s.scanError;
}

function renderUnis(s) {
  $('unis').innerHTML = s.universes.length ? `<table><tr><th>Universo</th><th>Dirección</th><th>Emisor</th><th>Paquetes/s</th><th>Estado</th><th>Destino</th></tr>` +
    s.universes.map(u => `<tr><td class="num">${u.universe}</td><td class="num">${addr(u.universe)}</td><td class="num">${esc(u.source)}</td><td class="num">${u.pps}</td>
      <td><span class="pill ${u.active ? 'ok' : ''}"><span class="dot"></span>${u.active ? 'Activo' : 'Sin datos'}</span></td>
      <td>${u.routed ? 'Enviado a una interfaz' : '<span style="color:var(--dim)">Sin interfaz asignada</span>'}</td></tr>`).join('') + `</table>`
    : `<div class="empty">Aún no llegó ningún universo Art-Net. Verifica que tu software de iluminación envíe a la IP de este equipo o por broadcast.</div>`;
}

async function refresh() {
  try {
    const s = await (await fetch('/api/state')).json();
    state = s;
    $('lost').style.display = 'none';
    renderNet(s); renderDevs(s); renderUnis(s);
    const log = $('log'), bottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
    log.textContent = s.log.join('\n');
    if (bottom) log.scrollTop = log.scrollHeight;
  } catch (e) {
    if (!quitting) $('lost').style.display = 'block';
  }
}

async function drawMon() {
  const u = Math.max(0, Math.min(32767, parseInt($('monU').value) || 0));
  try {
    const j = await (await fetch('/api/levels?u=' + u)).json();
    const bin = atob(j.levels), c = $('mon'), g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);
    let on = 0;
    for (let i = 0; i < 512; i++) {
      const v = bin.charCodeAt(i);
      if (v) on++;
      g.fillStyle = i % 16 < 8 ? '#ffb000' : '#b37b00';
      const h = v / 255 * c.height;
      g.fillRect(i * 2, c.height - h, 2, h);
    }
    $('monInfo').textContent = `${addr(u)} · ${on} de 512 canales con valor`;
  } catch (e) {}
}

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.uni) {
    const inputs = [...document.querySelectorAll(`[data-uni="${CSS.escape(t.dataset.uni)}"]`)];
    t.blur();
    post('/api/device', {id: t.dataset.uni, universes: inputs.map(i => parseInt(i.value) || 0)}, $('devErr'));
  } else if (t.dataset.kind) {
    t.blur();
    post('/api/device', {id: t.dataset.kind, kind: t.value}, $('devErr'));
  }
});
document.addEventListener('click', e => {
  const t = e.target;
  if (t.dataset.act) {
    const d = state.devices.find(x => x.id === t.dataset.id);
    if (!d) return;
    if (t.dataset.act === 'enable') post('/api/device', {id: d.id, enabled: !d.enabled}, $('devErr'));
    if (t.dataset.act === 'test') post('/api/device', {id: d.id, test: !d.test}, $('devErr'));
    if (t.dataset.act === 'forget' && confirm('¿Olvidar esta interfaz y su asignación de universos?')) post('/api/forget', {id: d.id}, $('devErr'));
  } else if (t.dataset.add) {
    post('/api/addport', {port: t.dataset.add}, $('devErr'));
  } else if (t.dataset.ip) {
    $('sourceIP').value = t.dataset.ip; saveNet();
  }
});
async function saveNet() {
  $('netErr').dataset.user = '1';
  const ok = await post('/api/network', {listenIP: $('listenIP').value, sourceIP: $('sourceIP').value, firstUniverse: parseInt($('firstUniverse').value) || 0}, $('netErr'));
  if (ok) { netDirty = false; delete $('netErr').dataset.user; }
}
for (const id of ['listenIP', 'sourceIP', 'firstUniverse']) $(id).addEventListener('input', () => netDirty = true);
$('saveNet').onclick = saveNet;
$('quit').onclick = async () => {
  if (!confirm('¿Cerrar LJ Buddy ArtNet Translator? Se dejará de enviar DMX.')) return;
  quitting = true;
  await post('/api/quit');
  document.body.innerHTML = '<main><section>LJ Buddy ArtNet Translator se cerró. Ya puedes cerrar esta pestaña.</section></main>';
};
refresh(); drawMon();
setInterval(refresh, 800); setInterval(drawMon, 200);
</script>
</body>
</html>
